<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Prompt assistant guide cover</title>
  <desc id="desc">A prompt assistant turns vague requests into clarified requirements and structured prompts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09111c"/>
      <stop offset="0.5" stop-color="#122035"/>
      <stop offset="1" stop-color="#16211a"/>
    </linearGradient>
    <linearGradient id="funnel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1000" cy="116" r="150" fill="#38bdf8" opacity="0.08"/>
  <circle cx="228" cy="510" r="180" fill="#f59e0b" opacity="0.08"/>
  <text x="84" y="124" fill="#eefafa" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="850">Prompt Assistant</text>
  <text x="88" y="170" fill="#a6b7c8" font-family="Segoe UI, Arial, sans-serif" font-size="23">clarify first, then generate executable prompts</text>
  <g transform="translate(82 232)" font-family="Segoe UI, Arial, sans-serif">
    <rect width="300" height="72" rx="18" fill="#111c2c" stroke="#334155"/>
