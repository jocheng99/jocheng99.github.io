    <rect y="124" width="300" height="72" rx="18" fill="#111c2c" stroke="#38bdf8"/>
    <text x="26" y="168" fill="#dff7ff" font-size="22">missing context?</text>
    <rect y="248" width="300" height="72" rx="18" fill="#111c2c" stroke="#5eead4"/>
    <text x="26" y="292" fill="#e3fffb" font-size="22">ask concise questions</text>
  </g>
  <g transform="translate(452 194)">
