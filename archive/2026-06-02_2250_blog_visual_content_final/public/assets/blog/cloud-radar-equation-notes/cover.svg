    <text x="86" y="158" fill="#9fb4c5" font-size="23">range gates, reflectivity, Doppler velocity</text>
  </g>
  <g font-family="Cambria Math, Georgia, serif" fill="#e8fff8" font-size="30">
    <text x="756" y="470">R = c&#916;t / 2</text>
    <text x="756" y="516">Z<tspan baseline-shift="sub" font-size="18">dBZ</tspan> = 10 log<tspan baseline-shift="sub" font-size="18">10</tspan>(Z)</text>
    <text x="756" y="562">v<tspan baseline-shift="sub" font-size="18">r</tspan> = &#955; f<tspan baseline-shift="sub" font-size="18">d</tspan> / 2</text>
  </g>
