<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Cloud radar equation notes cover</title>
  <desc id="desc">A cloud radar beam with range gates, Doppler spectrum, and simplified equations.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07121d"/>
      <stop offset="0.58" stop-color="#0d2532"/>
      <stop offset="1" stop-color="#17231c"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.02"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#facc15" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <g opacity="0.16" stroke="#a7f3d0" stroke-width="1">
    <path d="M0 420h1200M0 504h1200"/>
    <path d="M150 390v160M300 390v160M450 390v160M600 390v160M750 390v160M900 390v160M1050 390v160"/>
  </g>
