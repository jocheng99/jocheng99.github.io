    <circle cx="70" cy="6" r="24" fill="#07121d" stroke="#5eead4" stroke-width="4"/>
    <path d="M44 6h52M70-20v52" stroke="#5eead4" stroke-width="3" opacity="0.6"/>
  </g>
  <g fill="#dbeafe" opacity="0.82">
