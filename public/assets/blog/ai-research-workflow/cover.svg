<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AI research workflow cover</title>
  <desc id="desc">A dark console-style workflow map connecting research, code, literature, writing, and verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0d1824"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#94a3b8" stroke-width="1">
    <path d="M0 105h1200M0 210h1200M0 315h1200M0 420h1200M0 525h1200"/>
    <path d="M120 0v630M240 0v630M360 0v630M480 0v630M600 0v630M720 0v630M840 0v630M960 0v630M1080 0v630"/>
  </g>
  <rect x="76" y="62" width="1048" height="506" rx="28" fill="#07111f" opacity="0.76" stroke="#1f3b4d"/>
  <text x="110" y="134" fill="#e5f7f5" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="800">AI Research Workflow</text>
  <text x="112" y="178" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="22">roles, task cards, context, execution, verification</text>
  <g fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M208 330 C296 236 388 236 476 330 S656 424 744 330 S924 236 1012 330"/>
    <path d="M476 330h268"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(138 260)">
      <rect width="154" height="116" rx="18" fill="#0f2430" stroke="#5eead4"/>
      <circle cx="32" cy="32" r="10" fill="#5eead4"/>
      <text x="28" y="68" fill="#e2f8f6" font-size="22" font-weight="800">Research</text>
      <text x="28" y="94" fill="#94a3b8" font-size="15">question map</text>
    </g>
    <g transform="translate(322 224)">
      <rect width="154" height="116" rx="18" fill="#0f2235" stroke="#38bdf8"/>
      <path d="M36 36h40M36 58h74M36 80h54" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
      <text x="28" y="68" fill="#e2f8ff" font-size="22" font-weight="800">Code</text>
      <text x="28" y="94" fill="#94a3b8" font-size="15">run + check</text>
    </g>
    <g transform="translate(510 318)">
      <rect width="180" height="116" rx="18" fill="#132032" stroke="#a78bfa"/>
      <path d="M36 30h42v56H36zM82 30h42v56H82" fill="none" stroke="#a78bfa" stroke-width="4"/>
      <text x="28" y="68" fill="#f0eaff" font-size="22" font-weight="800">Literature</text>
      <text x="28" y="94" fill="#94a3b8" font-size="15">evidence chain</text>
    </g>
    <g transform="translate(724 224)">
      <rect width="170" height="116" rx="18" fill="#1a2430" stroke="#f59e0b"/>
      <path d="M36 32h76M36 54h98M36 76h66" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
      <text x="28" y="68" fill="#fff7df" font-size="22" font-weight="800">Writing</text>
      <text x="28" y="94" fill="#94a3b8" font-size="15">claim control</text>
    </g>
    <g transform="translate(932 260)">
      <rect width="154" height="116" rx="18" fill="#10261f" stroke="#4ade80"/>
      <path d="M35 63l24 24 58-66" fill="none" stroke="#4ade80" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="68" fill="#e4ffe9" font-size="22" font-weight="800">Verify</text>
      <text x="28" y="94" fill="#94a3b8" font-size="15">reproducible</text>
    </g>
  </g>
  <g transform="translate(110 486)" font-family="Consolas, Menlo, monospace" font-size="20" fill="#8eeadf">
    <text>&gt; understand</text>
    <text x="190">&gt; plan</text>
    <text x="320">&gt; execute</text>
    <text x="484">&gt; validate</text>
  </g>
</svg>
